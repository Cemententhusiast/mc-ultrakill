name: Publish beta release

on:
  push:
    tags:
      - 'v*-beta.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify version and release notes
        shell: bash
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          test "$GITHUB_REF_NAME" = "v$version"
          test -s "releases/$GITHUB_REF_NAME.md"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and run unit tests
        run: ./gradlew --no-daemon build
      - name: Package beta assets
        shell: bash
        run: |
          mkdir -p build/release-beta
          cp "build/libs/ultrastyle-$RELEASE_VERSION.jar" build/release-beta/
          cd build/release-beta
          sha256sum "ultrastyle-$RELEASE_VERSION.jar" > SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "Beta 0.1" \
            --notes-file "releases/$GITHUB_REF_NAME.md" \
            "build/release-beta/ultrastyle-$RELEASE_VERSION.jar" \
            build/release-beta/SHA256SUMS.txt
